# Runs all the tests on every change saved to GitHub. It never publishes:
# that is only the "Pubblica su Netsons" button.
name: Prove

on:
  push:
  workflow_dispatch:

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove automatiche
        working-directory: tests
        run: |
          npm ci --no-audit --no-fund
          node run-all.mjs
